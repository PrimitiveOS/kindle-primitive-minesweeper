[workspace]
resolver = "2"
members = ["crates/minesweeper-core", "crates/minesweeper-render", "crates/minesweeper-kindle", "crates/minesweeper-desktop"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
minesweeper-core = { path = "crates/minesweeper-core" }
minesweeper-render = { path = "crates/minesweeper-render" }
primitive-app = { path = "../doannt-kindle-tools/crates/primitive-app" }
primitive-ui = { path = "../doannt-kindle-tools/crates/primitive-ui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
